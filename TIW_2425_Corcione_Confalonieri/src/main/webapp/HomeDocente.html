<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Home Docente</title>
</head>
<body>
	<!-- <div align="right">
		<a th:href="@{/Logout}">Logout</a>
	</div> -->
	<h1><span>Benvenuto nella home Docente, </span>
	<span th:text="${session.user.name}">Nome</span></h1>
	<span th:if="${courses == null or #lists.isEmpty(courses)}">Nessun corso da vedere. </span>
	<span th:unless="${courses == null or #lists.isEmpty(courses)}">
		<table> 
			<thead>
			 	<tr>
			 		<td>Codice corso</td>
			 		<td>Nome corso</td>
			 		<td>Vedi corso</td>
			 	</tr> 
			</thead>
			<tbody>
				<tr th:each="course : ${courses}">
					<td th:text="${course.code}" />
					<td th:text="${course.name}" />
					<td><a th:href="@{/GoToExamsTeacher(course=${course.code},courseName=${course.name})}"> Vai al corso </a></td>
				</tr>
			</tbody>
		</table>
	</span>
</body>
</html>
