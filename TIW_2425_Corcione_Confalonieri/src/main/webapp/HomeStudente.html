<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Home Studente</title>
<link rel="stylesheet" href=css/style.css>
</head>
<body>
	<div align = "right">
		<form action="Logout" method="GET">
				<input type="submit" value="Logout">
		</form>
	</div>
	<h1><span>Benvenuto nella home Studente</span>
	<span th:text="${session.user.name}">Nome</span></h1>
	<span th:if="${courses == null or #lists.isEmpty(courses)}">Nessun corso da vedere. </span>
	<span th:unless="${courses == null or #lists.isEmpty(courses)}">
		<table> 
			<thead>
			 	<tr>
			 		<td>Codice corso</td>
			 		<td>Nome corso</td>
			 		<td>Vedi corso</td>
			 	</tr> 
			</thead>
			<tbody>
				<tr th:each="course : ${courses}">
					<td th:text="${course.code}" />
					<td th:text="${course.name}" />
					<td><a th:href="@{/GoToExamsStudent(course=${course.code})}"> Vai al corso </a></td>
				</tr>
			</tbody>
		</table>
	</span>
</body>
</html>
