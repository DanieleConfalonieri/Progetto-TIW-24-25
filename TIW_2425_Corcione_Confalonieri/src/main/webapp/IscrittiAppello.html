<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>AppelliDocente</title>
<link rel="stylesheet" href=css/style.css>
</head>
<body>
	<!-- <div align="right">
		<a th:href="@{/Logout}">Logout</a>
	</div> -->
	<h1>Iscritti all'appello
		<span th:text="${examId}">examId</span>
		<span> in data </span>
		<span th:text="${examDate}">examDate</span>
		<span> del corso </span>
		<span th:text="${courseName}">courseId</span>
	</h1>
	<div th:if="${registrations == null or #lists.isEmpty(registrations)}">Nessun iscritto per questo appello.</div>
	<div th:unless="${registrations == null or #lists.isEmpty(registrations)}">
		<form method="GET" th:action="@{/Reorder}">
			<input type="hidden" name="examId" th:value="${examId}" />
		    <input type="hidden" name="data" th:value="${examDate}" />
		    <input type="hidden" name="courseName" th:value="${courseName}" />
		    <input type="hidden" name="isPublishable" th:value="${isPublishable}" />
		    <input type="hidden" name="isVerbalizable" th:value="${isVerbalizable}" />
			<table>
				<thead>
					<tr>
						<th><button type="submit" name="sortField" value="Matricola">Matricola</button></th>
						<th><button type="submit" name="sortField" value="Cognome">Cognome</button></th>
						<th><button type="submit" name="sortField" value="Nome">Nome</button></th>
						<th><button type="submit" name="sortField" value="Email">Email</button></th>
						<th><button type="submit" name="sortField" value="Degree">Corso di Laurea</button></th>
						<th><button type="submit" name="sortField" value="Grade">Voto</button></th>
						<th><button type="submit" name="sortField" value="StatusGrade">Stato Voto</button></th>
						<th><button type="submit" name="sortField" value="ReportCode">Codice Verbale</button></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="registration, i : ${registrations}">
						<td>
							<span th:text="${registration.student.id}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].student.id'" th:value="${registration.student.id}" />
						</td>
						<td>
							<span th:text="${registration.student.surname}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].student.surname'" th:value="${registration.student.surname}" />
						</td>
						<td>
							<span th:text="${registration.student.name}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].student.name'" th:value="${registration.student.name}" />
						</td>
						<td>
							<span th:text="${registration.student.email}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].student.email'" th:value="${registration.student.email}" />
						</td>
						<td>
							<span th:text="${registration.student.degree}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].student.degree'" th:value="${registration.student.degree}" />
						</td>
						<td>
							<span th:text="${registration.grade}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].grade'" th:value="${registration.grade}" />
						</td>
						<td>
							<span th:text="${registration.statusGrade.name()=='NON_INSERITO' ? 'NON INSERITO' : registration.statusGrade}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].statusGrade'" th:value="${registration.statusGrade}" />
						</td>
						<td>
							<span th:text="${registration.reportCode==0 ? '-' : registration.reportCode}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].reportCode'" th:value="${registration.reportCode}" />
						</td>
						<td>
							<div th:unless="${#strings.equals(registration.statusGrade, 'PUBBLICATO') or #strings.equals(registration.statusGrade, 'VERBALIZZATO') or #strings.equals(registration.statusGrade, 'RIFIUTATO')}">
								<a th:href="@{/GoToUpdate(examId=${examId},studId=${registration.student.id})}">MODIFICA</a>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</form>
		
		<div th:if="${isPublishable}">
			<form action="PublishGrades" method="GET">
				<input type="hidden" name="examId" th:value="${examId}">
				<input type="submit" value="PUBBLICA">
			</form>
		</div>
		<div th:if="${isVerbalizable}">
			<form action="RegisterGrades" method="GET">
				<input type="hidden" name="examId" th:value="${examId}">
				<input type="submit" value="VERBALIZZA">
			</form>
		</div>
	</div>
</body>
</html>
