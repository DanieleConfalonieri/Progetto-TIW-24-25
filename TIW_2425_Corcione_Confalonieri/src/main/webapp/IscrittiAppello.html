		<form method="GET" th:action="@{/Reorder}">
			<input type="hidden" name="examId" th:value="${examId}" />
		    <input type="hidden" name="data" th:value="${examDate}" />
		    <input type="hidden" name="courseId" th:value="${courseName}" />
			<table>
				<thead>
					<tr>
						<th><button type="submit" name="sortField" value="Matricola">Matricola</button></th>
						<th><button type="submit" name="sortField" value="Cognome">Cognome</button></th>
						<th><button type="submit" name="sortField" value="Nome">Nome</button></th>
						<th><button type="submit" name="sortField" value="Email">Email</button></th>
						<th><button type="submit" name="sortField" value="Degree">Corso di Laurea</button></th>
						<th><button type="submit" name="sortField" value="Grade">Voto</button></th>
						<th><button type="submit" name="sortField" value="StatusGrade">Stato Voto</button></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="registration, i : ${registrations}">
						<td>
							<span th:text="${registration.student.id}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].student.id'" th:value="${registration.student.id}" />
						</td>
						<td>
							<span th:text="${registration.student.surname}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].student.surname'" th:value="${registration.student.surname}" />
						</td>
						<td>
							<span th:text="${registration.student.name}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].student.name'" th:value="${registration.student.name}" />
						</td>
						<td>
							<span th:text="${registration.student.email}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].student.email'" th:value="${registration.student.email}" />
						</td>
						<td>
							<span th:text="${registration.student.degree}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].student.degree'" th:value="${registration.student.degree}" />
						</td>
						<td>
							<span th:text="${registration.grade}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].grade'" th:value="${registration.grade}" />
						</td>
						<td>
							<span th:text="${registration.statusGrade}"></span>
							<input type="hidden" th:name="'registrations['+${i.index}+'].statusGrade'" th:value="${registration.statusGrade}" />
						</td>
<!-- 						<td> -->
<!-- 							<a th:href="">MODIFICA</a> -->
<!-- 						</td> -->

				</tbody>
			</table>
