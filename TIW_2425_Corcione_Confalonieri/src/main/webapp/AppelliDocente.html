<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>AppelliDocente</title>
</head>
<body>
	<!-- <div align="right">
		<a th:href="@{/Logout}">Logout</a>
	</div> -->
	<h1>Appelli per il corso </h1>
	<h1 th:text="${courseName}">nomecorso</h1>
	<table> 
		<thead>
		 	<tr>Appelli:</tr> 
		</thead>
		<tbody>
			<tr th:each="exam : ${exams}">
			<td th:text="${exam.code}">Nessun appello da vedere.</td>
			<td th:text="${exam.date}"> </td>
			<td th:text="${exam.course}"> </td>
			</tr>
		</tbody>
	</table>
</body>
</html>
