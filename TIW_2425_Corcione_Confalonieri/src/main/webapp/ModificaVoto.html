<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Modifica voto</title>
<link rel="stylesheet" href=css/style.css>
</head>
<body>
	<div align = "right">
		<form action="Logout" method="GET">
				<input type="submit" value="Logout">
		</form>
	</div>
	<h1>Modifica del voto per lo studente
		<span th:text="${registration.student.id}">studId</span>
		<span> per l'appello </span>
		<span th:text="${registration.examCode}">examId</span>
	</h1>
	<form method="POST" th:action="@{/UpdateGrade}">
			<input type="hidden" name="examId" th:value="${registration.examCode}" /> <br>
		    <input type="hidden" name="studId" th:value="${registration.student.id}" /> <br>
		    <span th:text="'Matricola: ' + ${registration.student.id}">Matricola</span> <br>
		    <span th:text="${'Nome: ' + registration.student.name}">Nome</span> <br>
		    <span th:text="${'Cognome: ' + registration.student.surname}">Cognome</span> <br>
		    <span th:text="${'Email: ' + registration.student.email}">Email</span> <br>
		    <span th:text="${'Corso di laurea: ' + registration.student.degree}">Corso di laurea</span> <br>
		    <input type="text" th:name="newGrade" th:value="${registration.grade}" /> <br>
		    <span th:text="${'Stato attuale: ' + registration.statusGrade}">Stato attuale</span> <br>
	</form>
</body>
</html>
